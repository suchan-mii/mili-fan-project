<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title id="pageTitle">Review</title>
    <script src="jquery-4.0.0.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            min-height: 100vh;
        }
        
        body.dark-mode {
            background: #101018;
            color: #eee;
        }
        
        body.light-mode {
            background: #f5f5f5;
            color: #1a1a1a;
        }
        
        .overlay {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        body.dark-mode .overlay {
            background: rgba(0, 0, 0, 0.75);
        }
        
        body.light-mode .overlay {
            background: rgba(255, 255, 255, 0.85);
        }
        
        .header {
            padding: 15px 20px;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        body.light-mode .header {
            border-bottom: 1px solid #ccc;
        }
        
        .header-left {
            display: flex;
            gap: 10px;
        }
        
        .back-link, .home-link {
            color: #000;
            background: #c9a24d;
            text-decoration: none;
            font-size: clamp(14px, 3.5vw, 16px);
            padding: 10px 20px;
            border-radius: 6px;
            display: inline-block;
            font-weight: bold;
            white-space: nowrap;
        }
        
        .back-link:hover {
            background: #d4ad5e;
        }
        
        .home-link {
            background: #2a2a35;
            color: #c9a24d;
            border: 1px solid #c9a24d;
        }
        
        body.light-mode .home-link {
            background: #e0e0e0;
        }
        
        .home-link:hover {
            background: #c9a24d;
            color: #000;
        }
        
        .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .toggle-sections {
            display: flex;
            gap: 10px;
        }
        
        .toggle-btn {
            background: #2a2a35;
            color: #c9a24d;
            border: 1px solid #c9a24d;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }
        
        body.light-mode .toggle-btn {
            background: #e0e0e0;
        }
        
        .toggle-btn:hover {
            background: #c9a24d;
            color: #000;
        }
        
        .theme-toggle {
            background: #2a2a35;
            color: #c9a24d;
            border: 1px solid #c9a24d;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        
        body.light-mode .theme-toggle {
            background: #e0e0e0;
        }
        
        .content {
            display: flex;
            justify-content: center;
            padding: clamp(30px, 8vh, 80px) 20px;
            flex: 1;
        }
        
        .review-container {
            max-width: 800px;
            width: 100%;
            padding: 0 10px;
        }
        
        h1 {
            font-size: clamp(28px, 6vw, 42px);
            margin-bottom: 20px;
        }
        
        body.dark-mode h1 {
            color: #fff;
        }
        
        body.light-mode h1 {
            color: #1a1a1a;
        }
        
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 560px;
            margin: 20px auto 30px auto;
            border-radius: 8px;
        }
        
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }
        
        .rating-box {
            margin: 30px 0;
            padding: 20px;
            border-left: 5px solid #c9a24d;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
        }
        
        body.dark-mode .rating-box {
            background: #1a1a25;
        }
        
        body.light-mode .rating-box {
            background: #e8e8e8;
        }
        
        .rating-box strong {
            font-size: clamp(16px, 4vw, 18px);
        }
        
        body.dark-mode .rating-box strong {
            color: #fff;
        }
        
        body.light-mode .rating-box strong {
            color: #1a1a1a;
        }
        
        h2 {
            font-size: clamp(24px, 5vw, 32px);
            margin: 30px 0 15px;
            cursor: pointer;
        }
        
        body.dark-mode h2 {
            color: #fff;
        }
        
        body.light-mode h2 {
            color: #1a1a1a;
        }
        
        h2:hover {
            color: #c9a24d;
        }
        
        p {
            line-height: 1.9;
            font-size: clamp(16px, 4vw, 18px);
            margin-bottom: 25px;
        }
        
        body.dark-mode p {
            color: #ccc;
        }
        
        body.light-mode p {
            color: #333;
        }
        
        .error-message {
            text-align: center;
            color: #c9a24d;
            font-size: 24px;
            margin-top: 50px;
        }
        
        .return-button {
            margin-top: 40px;
            padding: clamp(12px, 3vw, 14px) clamp(24px, 6vw, 32px);
            background: #c9a24d;
            color: #000;
            text-decoration: none;
            font-size: clamp(16px, 4vw, 18px);
            font-weight: bold;
            border-radius: 6px;
            display: inline-block;
        }
        
        .return-button:hover {
            background: #d4ad5e;
        }
        
        .coming-soon {
            text-align: center;
            padding: 40px 20px;
            border-radius: 8px;
            margin: 30px 0;
        }
        
        body.dark-mode .coming-soon {
            background: #1a1a25;
        }
        
        body.light-mode .coming-soon {
            background: #e8e8e8;
        }
        
        .coming-soon h3 {
            color: #c9a24d;
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .coming-soon p {
            margin-bottom: 0;
        }
        
        body.light-mode .coming-soon p {
            color: #555;
        }
    </style>
</head>
<body class="dark-mode">
    <div class="overlay">
        <div class="header">
            <div class="header-left">
                <a href="#" class="back-link" id="backLink">&larr; Back to Song</a>
                <a href="mili.html" class="home-link">Home</a>
            </div>
            <div class="header-right" id="headerRight">
                <button class="theme-toggle">🌙 Dark Mode</button>
            </div>
        </div>
        
        <div class="content">
            <div class="review-container">
                <div id="reviewContent"></div>
                <div id="comingSoonContent" style="display:none;">
                    <div class="coming-soon">
                        <h3>📝 Full Review Coming Soon</h3>
                        <p>We're still working on the detailed analysis for this song.</p>
                        <p style="margin-top: 15px;">Check back later for the complete review!</p>
                    </div>
                </div>
                <div id="errorContent" style="display:none;">
                    <h1>Review Not Found</h1>
                    <p class="error-message">This song doesn't exist.</p>
                    <div style="text-align: center;">
                        <a href="milicatalog.html" class="return-button">Return to Catalog</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
    function getYouTubeEmbedUrl(url) {
        var match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/))([^?&"'<>]+)/);
        return match ? 'https://www.youtube.com/embed/' + match[1] : null;
    }
    
    $(document).ready(function(){
        var theme = localStorage.getItem('theme') || 'dark';
        $('body').removeClass('dark-mode light-mode').addClass(theme + '-mode');
        $('.theme-toggle').text(theme === 'dark' ? '🌙 Dark Mode' : '☀️ Light Mode');
        
        $('.theme-toggle').click(function(){
            if($('body').hasClass('dark-mode')) {
                $('body').removeClass('dark-mode').addClass('light-mode');
                $(this).text('☀️ Light Mode');
                localStorage.setItem('theme', 'light');
            } else {
                $('body').removeClass('light-mode').addClass('dark-mode');
                $(this).text('🌙 Dark Mode');
                localStorage.setItem('theme', 'dark');
            }
        });
        
        var slug = new URLSearchParams(window.location.search).get('song');
        $('#backLink').attr('href', 'song.html?song=' + slug);
        
        $.getJSON('data.json', function(data) {
            var song = data.songs.find(function(s) { return s.slug === slug; });
            
            if (song && song.review && song.review.rating) {
                document.title = song.title + ' Review';
                
                var embedUrl = null;
                if (song.review.youtube_url) {
                    embedUrl = getYouTubeEmbedUrl(song.review.youtube_url);
                }
                
                var html = '<h1>' + song.title + ' &mdash; Review</h1>';
                
                if (embedUrl) {
                    html += '<div class="video-container"><iframe src="' + embedUrl + '" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
                }
                
                html += '<div class="rating-box"><strong>Rating:</strong> <span class="rating-value">' + song.review.rating + '</span> / 10</div>';
                html += '<h2 class="section-header">Musical Composition</h2>';
                html += '<p class="section-content">' + song.review.composition.replace(/\n/g, '<br>') + '</p>';
                html += '<h2 class="section-header">Lyrics & Symbolism</h2>';
                html += '<p class="section-content">' + song.review.lyrics.replace(/\n/g, '<br>') + '</p>';
                html += '<h2 class="section-header">Emotional Impact</h2>';
                html += '<p class="section-content">' + song.review.emotional.replace(/\n/g, '<br>') + '</p>';
                html += '<h2 class="section-header">Final Thoughts</h2>';
                html += '<p class="section-content">' + song.review.final_thoughts.replace(/\n/g, '<br>') + '</p>';
                
                $('#reviewContent').html(html);
                
                $('#headerRight').prepend('<div class="toggle-sections"><button class="toggle-btn" data-action="expand">Expand All</button><button class="toggle-btn" data-action="collapse">Collapse All</button></div>');
                
                $('.section-header').click(function(){
                    $(this).next('.section-content').slideToggle(300);
                });
                
                $('.toggle-btn[data-action="expand"]').click(function(){
                    $('.section-content').slideDown(300);
                });
                
                $('.toggle-btn[data-action="collapse"]').click(function(){
                    $('.section-content').slideUp(300);
                });
                
                $('.rating-box').click(function(){
                    alert('This song is rated ' + song.review.rating + '/10');
                });
                
            } else if (song) {
                document.title = song.title + ' Review';
                $('#reviewContent').html('<h1>' + song.title + ' &mdash; Review</h1>');
                $('#comingSoonContent').show();
            } else {
                document.title = 'Review Not Found';
                $('#errorContent').show();
                $('#backLink').hide();
            }
        });
    });
    </script>
</body>
</html>
